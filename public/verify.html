<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060313">

  <title>NICEGOLD MON • Verify Access</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(133, 64, 255, .34),
          transparent 31%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(45, 197, 255, .22),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 105%,
          rgba(157, 51, 255, .25),
          transparent 38%
        ),
        #05020f;
    }

    /* Animated background */

    .aurora {
      position: fixed;
      inset: -30%;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 30% 40%,
          rgba(130, 52, 255, .18),
          transparent 35%
        ),
        radial-gradient(
          ellipse at 70% 60%,
          rgba(30, 194, 255, .13),
          transparent 35%
        );

      filter: blur(60px);

      animation:
        auroraMove 20s ease-in-out infinite alternate;
    }

    @keyframes auroraMove {
      0% {
        transform:
          translate3d(-2%, -2%, 0)
          rotate(0deg)
          scale(1);
      }

      50% {
        transform:
          translate3d(4%, 3%, 0)
          rotate(3deg)
          scale(1.07);
      }

      100% {
        transform:
          translate3d(-3%, 5%, 0)
          rotate(-3deg)
          scale(1.03);
      }
    }

    /* Glowing orbs */

    .orb {
      position: fixed;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      filter: blur(100px);

      opacity: .30;

      z-index: 1;

      pointer-events: none;

      animation:
        orbFloat 16s ease-in-out infinite alternate;
    }

    .orb.one {
      background: #873dff;
      left: -130px;
      top: -130px;
    }

    .orb.two {
      background: #1ccfff;
      right: -150px;
      top: 35%;

      animation-delay: -5s;
      animation-duration: 19s;
    }

    .orb.three {
      background: #d14cff;
      bottom: -170px;
      left: 35%;

      animation-delay: -9s;
      animation-duration: 22s;
    }

    @keyframes orbFloat {
      0% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      50% {
        transform:
          translate3d(60px, -45px, 0)
          scale(1.12);
      }

      100% {
        transform:
          translate3d(-45px, 60px, 0)
          scale(.95);
      }
    }

    /* Soft grid */

    .grid {
      position: fixed;
      inset: 0;

      z-index: 1;

      pointer-events: none;

      opacity: .10;

      background-image:
        linear-gradient(
          rgba(164, 101, 255, .2) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(164, 101, 255, .2) 1px,
          transparent 1px
        );

      background-size: 60px 60px;

      animation:
        gridMove 18s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(60px);
      }
    }

    /* Floating particles */

    .particles {
      position: fixed;
      inset: 0;

      overflow: hidden;

      z-index: 2;

      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #cba4ff;

      box-shadow:
        0 0 10px #9a5cff,
        0 0 20px rgba(154, 92, 255, .6);

      animation:
        particleRise linear infinite;
    }

    .particle:nth-child(1) {
      left: 7%;
      bottom: -20px;
      animation-duration: 12s;
    }

    .particle:nth-child(2) {
      left: 22%;
      bottom: -20px;
      animation-duration: 17s;
      animation-delay: -4s;
    }

    .particle:nth-child(3) {
      left: 40%;
      bottom: -20px;
      animation-duration: 14s;
      animation-delay: -7s;
    }

    .particle:nth-child(4) {
      left: 58%;
      bottom: -20px;
      animation-duration: 19s;
      animation-delay: -2s;
    }

    .particle:nth-child(5) {
      left: 76%;
      bottom: -20px;
      animation-duration: 15s;
      animation-delay: -8s;
    }

    .particle:nth-child(6) {
      left: 91%;
      bottom: -20px;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    @keyframes particleRise {
      0% {
        transform:
          translate3d(0, 0, 0)
          scale(.4);

        opacity: 0;
      }

      15% {
        opacity: .8;
      }

      50% {
        transform:
          translate3d(35px, -50vh, 0)
          scale(1);
      }

      85% {
        opacity: .7;
      }

      100% {
        transform:
          translate3d(-30px, -115vh, 0)
          scale(.3);

        opacity: 0;
      }
    }

    /* Decorative rings */

    .ring {
      position: fixed;

      width: 430px;
      height: 430px;

      border-radius: 50%;

      border:
        1px solid
        rgba(164, 101, 255, .09);

      z-index: 1;

      pointer-events: none;

      animation:
        ringRotate 32s linear infinite;
    }

    .ring.one {
      left: -230px;
      bottom: -200px;
    }

    .ring.two {
      right: -260px;
      top: -220px;

      width: 510px;
      height: 510px;

      border-color:
        rgba(69, 207, 255, .07);

      animation-duration: 40s;
      animation-direction: reverse;
    }

    @keyframes ringRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Main card */

    .card {
      position: relative;

      z-index: 5;

      width: 100%;
      max-width: 440px;

      padding: 36px;

      text-align: center;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(18, 8, 43, .90),
          rgba(5, 15, 38, .82)
        );

      border:
        1px solid
        rgba(255, 255, 255, .11);

      backdrop-filter: blur(30px);

      box-shadow:
        0 35px 110px
        rgba(0, 0, 0, .55),

        inset 0 1px 0
        rgba(255, 255, 255, .08);

      animation:
        cardFloat 7s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* Lock icon */

    .icon {
      width: 72px;
      height: 72px;

      margin:
        0 auto 20px;

      display: grid;
      place-items: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(155, 92, 255, .25),
          rgba(69, 207, 255, .12)
        );

      border:
        1px solid
        rgba(177, 125, 255, .25);

      font-size: 29px;

      box-shadow:
        0 0 35px
        rgba(140, 70, 255, .18);

      animation:
        iconPulse 4s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%,
      100% {
        box-shadow:
          0 0 25px
          rgba(140, 70, 255, .12);
      }

      50% {
        box-shadow:
          0 0 45px
          rgba(140, 70, 255, .28);
      }
    }

    /* Branding */

    .brand {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #d3adff,
          #70d8ff,
          #ffffff
        );

      background-size: 220% auto;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        brandShine 7s linear infinite;
    }

    @keyframes brandShine {
      from {
        background-position: 0% center;
      }

      to {
        background-position: 220% center;
      }
    }

    h1 {
      margin-top: 21px;

      font-size: 26px;
      letter-spacing: -.5px;
    }

    .description {
      margin-top: 11px;

      color: #9690ad;

      font-size: 12px;

      line-height: 1.75;
    }

    /* Form */

    label {
      display: block;

      margin-top: 26px;
      margin-bottom: 8px;

      text-align: left;

      color: #c8c1dc;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: .6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #ad77ff;

      pointer-events: none;
    }

    input {
      width: 100%;

      padding:
        16px
        16px
        16px
        42px;

      border-radius: 14px;

      outline: none;

      background:
        rgba(255, 255, 255, .045);

      border:
        1px solid
        rgba(255, 255, 255, .10);

      color: white;

      font-size: 17px;

      letter-spacing: 4px;

      transition:
        .25s ease;
    }

    input::placeholder {
      color: #625d78;

      letter-spacing: 2px;
    }

    input:focus {
      background:
        rgba(155, 92, 255, .06);

      border-color:
        rgba(164, 100, 255, .70);

      box-shadow:
        0 0 0 3px
        rgba(155, 92, 255, .08),

        0 0 30px
        rgba(155, 92, 255, .08);
    }

    /* Button */

    button {
      position: relative;

      overflow: hidden;

      width: 100%;

      margin-top: 21px;

      padding: 16px;

      border: 0;
      border-radius: 14px;

      cursor: pointer;

      color: white;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: .7px;

      background:
        linear-gradient(
          100deg,
          #7140d4,
          #a057f2,
          #358fe9
        );

      background-size: 200% auto;

      box-shadow:
        0 14px 40px
        rgba(116, 65, 216, .30);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

      animation:
        buttonGlow 6s ease-in-out infinite;
    }

    button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -80%;

      width: 55%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.25),
          transparent
        );

      transform:
        skewX(-20deg);

      animation:
        buttonShine 4s ease-in-out infinite;
    }

    @keyframes buttonShine {
      0%,
      55% {
        left: -80%;
      }

      75%,
      100% {
        left: 130%;
      }
    }

    @keyframes buttonGlow {
      0%,
      100% {
        box-shadow:
          0 14px 40px
          rgba(116, 65, 216, .25);
      }

      50% {
        box-shadow:
          0 16px 48px
          rgba(116, 65, 216, .42);
      }
    }

    button:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 18px 50px
        rgba(116, 65, 216, .45);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    /* Messages */

    #message {
      min-height: 20px;

      margin-top: 17px;

      color: #8e88a5;

      font-size: 12px;

      line-height: 1.6;
    }

    .success {
      color: #5ee7a2 !important;
    }

    .error {
      color: #ff7d91 !important;
    }

    .back {
      display: inline-block;

      margin-top: 19px;

      color: #8f82b1;

      font-size: 11px;

      text-decoration: none;

      transition: .2s;
    }

    .back:hover {
      color: #c49aff;
    }

    /* Mobile */

    @media (max-width: 430px) {
      .card {
        padding: 28px 22px;
      }

      .brand {
        font-size: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="aurora"></div>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="grid"></div>

  <div class="ring one"></div>
  <div class="ring two"></div>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <main class="card">

    <div class="icon">
      🔐
    </div>

    <div class="brand">
      ✞𓉳 ⃝𝗡𝗜𝗖𝗘𝗚𝗢𝗟𝗗₊ ⃝ 𝗠𝗢𝗡𓉳 ⃝𓃵
    </div>

    <h1>
      Verify Your Access
    </h1>

    <p class="description">
      Your access request must be approved by
      the NICEGOLD administrator before you can
      continue. Enter your approved access code
      below.
    </p>

    <form id="verifyForm">

      <label for="code">
        ACCESS CODE
      </label>

      <div class="input-wrap">

        <div class="input-icon">
          🔑
        </div>

        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="Enter your code"
          maxlength="12"
          required
        >

      </div>

      <button
        id="verifyButton"
        type="submit"
      >
        VERIFY ACCESS
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="/request.html"
    >
      ← Request access
    </a>

  </main>

  <script>
    const form =
      document.getElementById("verifyForm");

    const button =
      document.getElementById("verifyButton");

    const message =
      document.getElementById("message");

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const code =
          document
            .getElementById("code")
            .value
            .trim();

        if (!code) {
          message.className = "error";
          message.textContent =
            "Please enter your access code.";
          return;
        }

        button.disabled = true;
        button.textContent = "VERIFYING...";

        message.className = "";
        message.textContent =
          "Checking your access...";

        try {

          const response =
            await fetch(
              "/api/access/verify",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    code: code
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Invalid or expired access code."
            );
          }

          message.className =
            "success";

          message.textContent =
            "✓ Access verified successfully.";

          if (data.redirect) {

  /*
   * Remember that this visitor has
   * successfully passed NICEGOLD access
   * verification on this browser.
   */

  localStorage.setItem(
    "nicegold_access_verified",
    "true"
  );


  /*
   * Keep the approved request ID if
   * the server provides one.
   */

  if (
    data.request &&
    data.request.requestId
  ) {

    localStorage.setItem(
      "nicegold_request_id",
      data.request.requestId
    );

  }


  /*
   * Continue to the protected
   * NICEGOLD website.
   */

  setTimeout(
    function () {

      window.location.href =
        data.redirect;

    },
    800
  );
     arguments
          }
        );
  </script>

<!-- =====================================================
     PART 8: NICEGOLD VISITOR ACCESS GATE
     ===================================================== -->

<script>
(function () {

  /*
   * Check whether this browser has already
   * completed NICEGOLD access verification.
   */

  const verified =
    localStorage.getItem(
      "nicegold_access_verified"
    );


  /*
   * If the visitor has not been approved,
   * send them to the Request Access page.
   */

  if (verified !== "true") {

    window.location.replace(
      "/request.html"
    );

    return;

  }


  /*
   * Visitor has verified access.
   * The NICEGOLD website can continue loading.
   */

})();
</script>
  
</body>
</html>
