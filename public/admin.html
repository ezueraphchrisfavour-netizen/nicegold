/* =====================================================
   LOAD REQUESTS
   ===================================================== */

async function loadRequests() {

  const container =
    document.getElementById(
      "requests"
    );

  if (!container) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/admin/requests",
        {
          credentials: "same-origin"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Could not load requests."
      );

    }


    const requests =
      Array.isArray(data.requests)
        ? data.requests
        : [];


    const pending =
      requests.filter(
        item =>
          item.status ===
          "pending"
      );


    const pendingCount =
      document.getElementById(
        "pendingCount"
      );


    if (pendingCount) {

      pendingCount.textContent =
        pending.length;

    }


    if (!requests.length) {

      container.innerHTML = `
        <div class="empty">
          <div style="font-size:32px;margin-bottom:10px;">
            ◇
          </div>

          <div>
            No access requests yet.
          </div>

          <small style="
            display:block;
            margin-top:8px;
            opacity:.55;
          ">
            New requests will appear here automatically.
          </small>
        </div>
      `;

      return;
    }


    container.innerHTML =
      requests
        .map(
          (request, index) =>
            createRequestCard(
              request,
              index
            )
        )
        .join("");


  } catch (error) {

    console.error(
      "Load requests error:",
      error
    );


    container.innerHTML = `
      <div class="empty">
        <div style="font-size:28px;margin-bottom:10px;">
          ⚠
        </div>

        <div>
          Could not load access requests.
        </div>

        <button
          class="btn"
          style="margin-top:15px;"
          onclick="loadRequests()"
        >
          TRY AGAIN
        </button>
      </div>
    `;

  }

}


/* =====================================================
   CREATE REQUEST CARD
   ===================================================== */

function createRequestCard(
  request,
  index
) {

  const status =
    String(
      request.status ||
      "pending"
    ).toLowerCase();


  let statusClass =
    "status-pending";


  if (status === "approved") {

    statusClass =
      "status-approved";

  }

  else if (
    status === "rejected" ||
    status === "denied"
  ) {

    statusClass =
      "status-denied";

  }


  const name =
    escapeHTML(
      request.name ||
      "Unknown User"
    );


  const contact =
    escapeHTML(
      request.contact ||
      "Not provided"
    );


  const requestId =
    escapeHTML(
      request.requestId ||
      "N/A"
    );


  const createdAt =
    formatDate(
      request.createdAt
    );


  const approvedAt =
    formatDate(
      request.approvedAt
    );


  let actions = "";


  if (status === "pending") {

    actions = `
      <div class="actions">

        <button
          class="btn approve"
          onclick="
            approveRequest(
              '${escapeJS(request.requestId)}',
              this
            )
          "
        >
          ✓ APPROVE
        </button>

        <button
          class="btn deny"
          onclick="
            rejectRequest(
              '${escapeJS(request.requestId)}',
              this
            )
          "
        >
          ✕ REJECT
        </button>

      </div>
    `;

  }

  else if (status === "approved") {

    actions = `
      <div class="actions">

        <div class="info-item" style="flex:1;">
          <div class="info-label">
            ACCESS CODE
          </div>

          <div
            class="info-value"
            style="
              color:#9eeaff;
              font-weight:800;
              letter-spacing:1px;
            "
          >
            ${escapeHTML(
              request.accessCode ||
              "Generated"
            )}
          </div>
        </div>

      </div>
    `;

  }


  return `
    <article
      class="request-card"
      style="
        animation-delay:${index * 60}ms;
      "
    >

      <div class="request-top">

        <div>

          <div class="request-name">
            ${name}
          </div>

          <div style="
            margin-top:5px;
            font-size:11px;
            opacity:.45;
          ">
            ${requestId}
          </div>

        </div>

        <div
          class="request-status ${statusClass}"
        >
          ${escapeHTML(status)}
        </div>

      </div>


      <div class="request-info">

        <div class="info-item">

          <div class="info-label">
            CONTACT
          </div>

          <div class="info-value">
            ${contact}
          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            REQUESTED
          </div>

          <div class="info-value">
            ${createdAt}
          </div>

        </div>


        ${
          approvedAt !== "—"
            ? `
              <div class="info-item">

                <div class="info-label">
                  APPROVED
                </div>

                <div class="info-value">
                  ${approvedAt}
                </div>

              </div>
            `
            : ""
        }

      </div>


      ${actions}

    </article>
  `;

}


/* =====================================================
   LOAD STATISTICS
   ===================================================== */

async function loadStats() {

  try {

    const response =
      await fetch(
        "/api/admin/requests/stats",
        {
          credentials: "same-origin"
        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    const pending =
      document.getElementById(
        "pendingCount"
      );


    if (pending) {

      pending.textContent =
        Number(
          data.pending || 0
        );

    }

  } catch (error) {

    console.error(
      "Stats error:",
      error
    );

  }

}


/* =====================================================
   DATE FORMATTER
   ===================================================== */

function formatDate(
  value
) {

  if (!value) {
    return "—";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return escapeHTML(
      String(value)
    );

  }


  return date.toLocaleString(
    [],
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}


/* =====================================================
   HTML SAFETY
   ===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   JAVASCRIPT STRING SAFETY
   ===================================================== */

function escapeJS(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\r/g,
      "\\r"
    )
    .replace(
      /\n/g,
      "\\n"
    );

}


/* =====================================================
   TOAST NOTIFICATION
   ===================================================== */

function showToast(
  type,
  text
) {

  let toast =
    document.getElementById(
      "ngToast"
    );


  if (!toast) {

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "ngToast";

    toast.style.cssText = `
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%) translateY(20px);
      z-index:9999;
      min-width:260px;
      max-width:90%;
      padding:15px 20px;
      border-radius:16px;
      border:1px solid rgba(90,210,255,.35);
      background:rgba(4,18,35,.88);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        0 0 30px rgba(30,180,255,.12);
      color:#e9fbff;
      text-align:center;
      font-size:13px;
      font-weight:700;
      opacity:0;
      transition:
        opacity .3s ease,
        transform .3s ease;
    `;

    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    text;


  toast.style.borderColor =
    type === "ERROR"
      ? "rgba(255,70,100,.45)"
      : "rgba(90,210,255,.45)";


  requestAnimationFrame(
    () => {

      toast.style.opacity =
        "1";

      toast.style.transform =
        "translateX(-50%) translateY(0)";

    }
  );


  clearTimeout(
    window.ngToastTimer
  );


  window.ngToastTimer =
    setTimeout(
      () => {

        toast.style.opacity =
          "0";

        toast.style.transform =
          "translateX(-50%) translateY(20px)";

      },
      3000
    );

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

  window.location.href =
    "/login.html";

}


/* =====================================================
   INITIALIZE ADMIN PANEL

loadRequests();

loadStats();


/* =====================================================
   AUTOMATIC REFRESH
   ===================================================== */

setInterval(
  () => {

    loadRequests();
    loadStats();

  },
  5000
);

</script>
