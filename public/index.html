<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NICEGOLD MON</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08080c;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      padding: 24px 18px;
      background: #111118;
      border-bottom: 1px solid #292933;
    }

    .brand {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
    }

    .subtitle {
      margin-top: 6px;
      color: #888894;
      font-size: 13px;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 25px auto;
    }

    .hero {
      background: #14141c;
      border: 1px solid #2a2a35;
      border-radius: 20px;
      padding: 23px;
      margin-bottom: 18px;
    }

    .label {
      color: #888894;
      font-size: 12px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .main-status {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 23px;
      font-weight: 700;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #32d477;
      box-shadow: 0 0 14px rgba(50, 212, 119, 0.7);
    }

    .dot.offline {
      background: #e04b4b;
      box-shadow: 0 0 14px rgba(224, 75, 75, 0.5);
    }

    .updated {
      margin-top: 10px;
      color: #777782;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: #14141c;
      border: 1px solid #292933;
      border-radius: 18px;
      padding: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .value {
      font-size: 18px;
      font-weight: 700;
    }

    .small {
      color: #858591;
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .online {
      color: #32d477;
    }

    .offline {
      color: #e04b4b;
    }

    .refresh {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ffffff;
      color: #111118;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      padding: 30px 10px;
      color: #666671;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      ✞𓉳 ⃝𝗡𝗜𝗖𝗘𝗚𝗢𝗟𝗗₊ ⃝ 𝗠𝗢𝗡𓉳 ⃝𓃵
    </div>

    <div class="subtitle">
      NICEGOLD MON Control Panel
    </div>
  </header>


  <main class="container">

    <!-- Main server status -->
    <section class="hero">

      <div class="label">
        SERVER STATUS
      </div>

      <div class="main-status">
        <span id="serverDot" class="dot"></span>

        <span id="serverStatus">
          Checking...
        </span>
      </div>

      <div id="lastUpdated" class="updated">
        Checking server...
      </div>

    </section>


    <!-- Dashboard cards -->
    <section class="grid">

      <div class="card">

        <div class="card-title">
          🤖 Bot
        </div>

        <div id="botStatus" class="value">
          Checking...
        </div>

        <div id="botMessage" class="small">
          Checking bot status...
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          📡 API
        </div>

        <div id="apiStatus" class="value">
          Checking...
        </div>

        <div class="small">
          NICEGOLD API connection
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          🌐 Website
        </div>

        <div class="value online">
          ONLINE
        </div>

        <div class="small">
          Public NICEGOLD website
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          ⚙️ System
        </div>

        <div class="value">
          NICEGOLD MON
        </div>

        <div class="small">
          Control panel
        </div>

      </div>

    </section>


    <button class="refresh" onclick="updateDashboard()">
      🔄 Refresh Status
    </button>


    <div class="footer">
      NICEGOLD MON • Live Control Panel
    </div>

  </main>


  <script>

    async function updateDashboard() {

      const serverStatus =
        document.getElementById("serverStatus");

      const serverDot =
        document.getElementById("serverDot");

      const lastUpdated =
        document.getElementById("lastUpdated");

      const botStatus =
        document.getElementById("botStatus");

      const botMessage =
        document.getElementById("botMessage");

      const apiStatus =
        document.getElementById("apiStatus");


      /*
       * Check server
       */

      try {

        const response =
          await fetch("/api/health", {
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data =
          await response.json();


        serverStatus.textContent =
          "NICEGOLD MON is online";

        serverStatus.className =
          "online";

        serverDot.className =
          "dot";

        apiStatus.textContent =
          "CONNECTED";

        apiStatus.className =
          "value online";


        lastUpdated.textContent =
          "Last checked: " +
          new Date().toLocaleTimeString();


      } catch (error) {

        serverStatus.textContent =
          "Server unavailable";

        serverStatus.className =
          "offline";

        serverDot.className =
          "dot offline";

        apiStatus.textContent =
          "OFFLINE";

        apiStatus.className =
          "value offline";

        lastUpdated.textContent =
          "Unable to reach NICEGOLD API";
      }


      /*
       * Check bot
       */

      try {

        const response =
          await fetch("/api/whatsapp/status", {
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error("Bot API error");
        }

        const data =
          await response.json();


        botStatus.textContent =
          data.state.toUpperCase();

        botMessage.textContent =
          data.message;


        if (data.state === "ready") {

          botStatus.className =
            "value online";

        } else {

          botStatus.className =
            "value offline";
        }


      } catch (error) {

        botStatus.textContent =
          "UNAVAILABLE";

        botStatus.className =
          "value offline";

        botMessage.textContent =
          "Could not retrieve bot status.";
      }

    }


    /*
     * Initial check
     */

    updateDashboard();


    /*
     * Automatically update every 10 seconds
     */

    setInterval(updateDashboard, 10000);

  </script>

</body>
</html>
